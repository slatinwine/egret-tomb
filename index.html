<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>白鹭冢 · 盗墓文字冒险</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#14110e;}
  #frame{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;border:0;}
  #fallback{position:absolute;top:0;left:0;right:0;bottom:0;display:none;color:#d8cdb8;font:15px/2 system-ui,-apple-system,sans-serif;padding:40px 24px;text-align:center;}
  #fallback a{color:#e0b36a;text-decoration:underline;}
</style>
</head>
<body>
<iframe id="frame" src="https://drifting-classroom.app.workbuddy.host/?sharecode=MYVEVIDCBE" allow="fullscreen; clipboard-write"></iframe>
<div id="fallback">
  <p><b>白鹭冢 · 盗墓文字冒险</b></p>
  <p>内嵌窗口未能加载（当前浏览器可能拦截了第三方窗口）。</p>
  <p><a href="https://drifting-classroom.app.workbuddy.host/?sharecode=MYVEVIDCBE">点此直达游戏主站 →</a></p>
</div>
<script>
/* 全屏壳：直接内嵌主站，游戏在主站自己的域名里同源运行——
 * 不需要沙箱桥、没有任何跨源请求，安卓/苹果/微信内置窗口通吃。
 * 个别浏览器拦截第三方 iframe 时，2.5 秒后显示直达链接兜底。 */
(function(){
  var loaded = false;
  var f = document.getElementById("frame");
  f.addEventListener("load", function(){
    loaded = true;
    f.style.display = "";
    document.getElementById("fallback").style.display = "none";
  });
  setTimeout(function(){
    if (!loaded) {
      f.style.display = "none";
      document.getElementById("fallback").style.display = "block";
    }
  }, 2500);
})();
</script>
</body>
</html>
